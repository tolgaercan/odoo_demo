[options]
; Veritabani yoneticisinin parolasi. Ilk veritabanini bu parola ile olustururuz.
; Sadece bu bilgisayardaki ogrenme ortami icindir. Sunucuyu internete acmadan once degistirilir.
admin_passwd = admin

; Odoo, veriyi PostgreSQL'de tutar. "db" adi docker-compose icindeki servis adidir.
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Tarayicida veritabani secme ekranini acik birakir. Yerel gelistirmede ise yarar.
list_db = True

; Ilk yol Odoo'nun kendi uygulamalari (stock dahil). Ikinci yol bizim custom_addons klasorumuz.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
